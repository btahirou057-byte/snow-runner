<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snow Runner</title>
<style>
:root{--bg:#dff1fb;--ink:#12324a;--card:#ffffffee;--accent:#e8452c;--gold:#f5b800;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c2a;--ink:#eaf4fb;--card:#16293bee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1c2a;--ink:#eaf4fb;--card:#16293bee;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#wrap{position:relative;height:100%;max-width:520px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-weight:800;font-size:22px;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.4)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border-radius:20px;padding:24px;text-align:center;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
h1{margin:0 0 8px;font-size:30px}p{margin:6px 0;line-height:1.4}small{opacity:.7}
button{margin-top:14px;font:inherit;font-weight:800;font-size:18px;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 28px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0</span><span id="cn">🪙 0</span></div>
<div id="ov"><div class="card"><h1 id="t">Snow Runner</h1><p id="m">Glissez à gauche ou à droite pour changer de voie, vers le haut pour sauter. Évitez les trains, ramassez les pièces.</p><button id="b">Jouer</button><p><small>Jeu gratuit · aucun gain réel</small></p></div></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let W,H,dpr,st='idle',lane=0,tl=0,y=0,vy=0,obs=[],coins=[],speed,dist,cn,best=0,spawnW,last=0,run=0,shake=0;
try{best=+localStorage.getItem('snowrunner-best')||0}catch(e){}
function rs(){dpr=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=cv.width=r.width*dpr;H=cv.height=r.height*dpr}
addEventListener('resize',rs);rs();
function reset(){lane=0;tl=0;y=0;vy=0;obs=[];coins=[];speed=13;dist=0;cn=0;spawnW=30;shake=0}
function spawn(){
 const free=Math.floor(Math.random()*3)-1,r=Math.random();
 for(let l=-1;l<=1;l++){
  if(l===free)continue;
  if(Math.random()<.75)obs.push({w:spawnW,l,t:r<.35?'low':'train'});
 }
 if(r<.35)for(let i=0;i<4;i++)coins.push({w:spawnW-3+i*1.6,l:free});
 else for(let i=0;i<5;i++)coins.push({w:spawnW-4+i*1.6,l:free});
 spawnW+=16+Math.random()*10;
}
function start(){reset();st='play';$('ov').style.display='none';last=performance.now()}
$('b').onclick=start;
function die(){
 st='over';shake=.4;const s=score();
 if(s>best){best=s;try{localStorage.setItem('snowrunner-best',best)}catch(e){}}
 $('t').textContent='C’est perdu !';
 $('m').textContent='Score : '+s+' · Meilleur : '+best;
 $('b').textContent='Rejouer';$('ov').style.display='flex';
}
const score=()=>Math.floor(dist)+cn*10;
function go(d){if(st!=='play')return;tl=Math.max(-1,Math.min(1,tl+d))}
function jump(){if(st==='play'&&y<=0.01)vy=9.5}
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);
 else if(e.key==='ArrowUp'||e.key===' ')jump();
});
let sx,sy;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
cv.addEventListener('pointerup',e=>{
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.abs(dx)<18&&Math.abs(dy)<18){jump();return}
 if(Math.abs(dx)>Math.abs(dy))go(dx>0?1:-1);else if(dy<0)jump();
});
function P(l,z){
 const hy=H*.3,gy=H*.82,lw=W*.3,s=1/(1+Math.max(z,-.9)/6);
 return{x:W/2+l*lw*s,y:hy+(gy-hy)*s,u:lw*s,s};
}
function update(dt){
 if(st!=='play')return;
 dist+=speed*dt;speed=Math.min(30,speed+dt*.35);run+=dt*speed*.6;
 lane+=(tl-lane)*Math.min(1,dt*14);
 vy-=30*dt;y+=vy*dt;if(y<0){y=0;vy=0}
 while(spawnW-dist<90)spawn();
 obs=obs.filter(o=>o.w-dist>-3);coins=coins.filter(c=>c.w-dist>-3);
 for(const o of obs){
  const z=o.w-dist;
  if(z<.6&&z>-.6&&Math.abs(lane-o.l)<.55){if(o.t==='low'&&y>.55)continue;die();return}
 }
 for(let i=coins.length-1;i>=0;i--){
  const c=coins[i],z=c.w-dist;
  if(z<.7&&z>-.7&&Math.abs(lane-c.l)<.55&&y<1.6){coins.splice(i,1);cn++}
 }
 $('sc').textContent=score();$('cn').textContent='🪙 '+cn;
}
function draw(){
 const hy=H*.3,g=ctx.createLinearGradient(0,0,0,hy);
 g.addColorStop(0,'#8fd0f5');g.addColorStop(1,'#e6f6ff');
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*20,(Math.random()-.5)*20);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,hy);
 ctx.fillStyle='#f4fbff';ctx.fillRect(0,hy,W,H-hy);
 ctx.fillStyle='#bcdcf0';ctx.beginPath();ctx.moveTo(0,hy);
 for(let i=0;i<=6;i++)ctx.lineTo(W*i/6,hy-(i%2?.07:.12)*H);
 ctx.lineTo(W,hy);ctx.fill();
 ctx.strokeStyle='#5b6b78';
 for(let l=-1;l<=1;l++)for(const o of[-.28,.28]){
  const a=P(l+o,80),b=P(l+o,-3);ctx.lineWidth=3*dpr;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 }
 ctx.strokeStyle='#a9b9c6';
 for(let z=-(dist%2.5);z<80;z+=2.5){
  for(let l=-1;l<=1;l++){const a=P(l-.42,z),b=P(l+.42,z);ctx.lineWidth=Math.max(1,5*a.s*dpr);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 }
 const items=[];
 for(const o of obs)items.push({k:o.t,z:o.w-dist,l:o.l});
 for(const c of coins)items.push({k:'coin',z:c.w-dist,l:c.l});
 items.sort((a,b)=>b.z-a.z);
 for(const it of items){
  if(it.z>85||it.z<-.8)continue;
  const p=P(it.l,it.z),u=p.u;
  if(it.k==='train'){
   ctx.fillStyle='#c93a2b';ctx.fillRect(p.x-.42*u,p.y-1.6*u,.84*u,1.6*u);
   ctx.fillStyle='#8f261b';ctx.fillRect(p.x-.42*u,p.y-1.6*u,.84*u,.22*u);
   ctx.fillStyle='#ffe9a8';ctx.fillRect(p.x-.3*u,p.y-1.2*u,.6*u,.4*u);
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y-.35*u,.12*u,0,7);ctx.fill();
  }else if(it.k==='low'){
   ctx.fillStyle='#f08a24';ctx.fillRect(p.x-.42*u,p.y-.55*u,.84*u,.3*u);
   ctx.fillStyle='#fff';for(let i=0;i<4;i++)ctx.fillRect(p.x-.42*u+i*.21*u+.05*u,p.y-.55*u,.1*u,.3*u);
   ctx.fillStyle='#555';ctx.fillRect(p.x-.38*u,p.y-.25*u,.07*u,.25*u);ctx.fillRect(p.x+.31*u,p.y-.25*u,.07*u,.25*u);
  }else{
   ctx.fillStyle='#f5b800';ctx.strokeStyle='#b88500';ctx.lineWidth=2*dpr;
   ctx.beginPath();ctx.arc(p.x,p.y-.5*u,.14*u,0,7);ctx.fill();ctx.stroke();
  }
 }
 const p=P(lane,0),u=p.u,jy=y*u*.55,sw=Math.sin(run*3)*.12*u,px=p.x,py=p.y-jy;
 ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(p.x,p.y,.25*u,.07*u,0,0,7);ctx.fill();
 ctx.fillStyle='#2b3a55';ctx.fillRect(px-.14*u+sw,py-.45*u,.1*u,.45*u);ctx.fillRect(px+.04*u-sw,py-.45*u,.1*u,.45*u);
 ctx.fillStyle='#3a9d5d';ctx.fillRect(px-.2*u,py-.9*u,.4*u,.5*u);
 ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(px,py-1.02*u,.14*u,0,7);ctx.fill();
 ctx.fillStyle='#e8452c';ctx.fillRect(px-.16*u,py-1.22*u,.32*u,.12*u);
 ctx.restore();
}
function loop(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;
 if(shake>0)shake-=dt;
 update(dt);draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(t=>{last=t;loop(t)});
</script>
</body>
  </html>
